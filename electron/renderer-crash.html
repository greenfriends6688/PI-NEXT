<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';"
  />
  <title>界面无法加载</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1117;
      color: #e6e8ee;
      font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
    }
    main {
      width: min(680px, calc(100vw - 48px));
      padding: 32px;
      background: #171a22;
      border: 1px solid #262b36;
      border-radius: 8px;
    }
    h1 { margin: 0 0 10px; font-size: 20px; font-weight: 600; }
    p.lead { margin: 0 0 22px; color: #a8afbe; }
    dl {
      margin: 0 0 26px;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 8px 20px;
      font-variant-numeric: tabular-nums;
    }
    dt { color: #8b93a5; white-space: nowrap; }
    dd { margin: 0; word-break: break-all; }
    button {
      padding: 9px 18px;
      border: 0;
      border-radius: 6px;
      background: #5b8cff;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { background: #6f9bff; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">界面无法加载</h1>
    <p class="lead">
      应用界面（渲染进程）已异常退出或长时间无响应，自动恢复没有成功。下面是诊断信息；
      本地服务若仍在运行，点击「重新加载」即可重试。
    </p>
    <dl>
      <dt>崩溃原因</dt><dd id="reason">—</dd>
      <dt>退出码</dt><dd id="exitCode">—</dd>
      <dt>发生时间</dt><dd id="occurredAt">—</dd>
      <dt>自动重试次数</dt><dd id="attempts">—</dd>
    </dl>
    <button id="reload" type="button">重新加载</button>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      function setText(id, value) {
        var el = document.getElementById(id);
        if (el) el.textContent = value && value.length ? value : "—";
      }
      var appName = params.get("appName");
      if (appName) {
        document.title = appName + " · 界面无法加载";
        setText("title", appName + " 界面无法加载");
      }
      setText("reason", params.get("reason"));
      setText("exitCode", params.get("exitCode"));
      setText("occurredAt", params.get("occurredAt"));
      setText("attempts", params.get("attempts"));
      document.getElementById("reload").addEventListener("click", function () {
        var url = params.get("retryUrl");
        if (url && /^https?:\/\//i.test(url)) window.location.href = url;
        else window.location.reload();
      });
    })();
  </script>
</body>
</html>
