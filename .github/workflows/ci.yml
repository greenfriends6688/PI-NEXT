name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
        env:
          E2E_SERVER_MODE: start
      # DSN-02：WCAG AA 对比度门禁。此前 e2e/themes.mjs 既没被任何运行器调用，
      # 且它的旧 contrast() 只会解析 hex（主题 token 已是 oklch）→ 断言恒失败。
      # 本步骤自起服务跑它，让 token 色彩回归在 CI 上被拦住。
      - name: Theme contrast gate (WCAG AA)
        run: |
          npx next start -H 127.0.0.1 -p 30141 &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:30141/ && break
            sleep 1
          done
          E2E_BASE_URL=http://127.0.0.1:30141 npm run test:themes
          kill "$SERVER_PID"
      # fork:design-gates —— 设计侧门禁进 CI（2026-09-30）。
      # 此前 check:design / verify:boards 谁也不跑：颜色有对比度门禁守着，
      # 而「按钮/位置与画板不一样」全是结构层的事，没有一条被拦住。
      # 静态部分不需要服务；live 部分（画板↔产品几何对位）要起服。
      - name: Design gates · 静态（字面量 / 动效 / 图标 / 画板 / 图标对齐）
        run: npm run check:design
      - name: Design gates · live（画板 ↔ 产品几何对位）
        run: |
          npx next start -H 127.0.0.1 -p 30141 &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:30141/ && break
            sleep 1
          done
          npm run verify:boards
          kill "$SERVER_PID"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure
          path: test-results/e2e/
          retention-days: 7
